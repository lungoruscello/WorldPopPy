[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "WorldPopPy"
dynamic = ["version"]
description = "Python client to help you work with WorldPop data for any region on earth"
readme = "readme_pypi.md"
requires-python = ">=3.10"
license = "MPL-2.0"
authors = [
  { name="Sascha Langenbach", email="lungoruscello@gmail.com" }
]
# The Python versions listed here are the ones tested by the `versions` session
# in `noxfile.py`, which reads them from these classifiers.
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy",
    "matplotlib",
    "httpx",
    "click>=8.0",
    "tabulate",
    "platformdirs",
    "nest_asyncio<2",
    "pqdm>=0.2",
    "tqdm",
    "backoff>=2,<3",
    "pandas",
    "pyarrow",
    "rasterio",
    "rioxarray",
    "tomli; python_version < '3.11'",
    "xarray",
    "dask",
    "bottleneck",
    "geopandas<2",
    "geopy",
    "pycountry",
    "pyproj",
    "shapely"
]

[project.optional-dependencies]
# Only needed to rebuild the bundled country borders from scratch (requires system GDAL)
gdal = [
    "gdal>=3"
]

# Dependencies for developing worldpoppy (PEP 735). These are not published
# with the package. `uv sync` installs the `dev` group by default.
[dependency-groups]
test = [
    "pytest>=7.0",
]
dev = [
    { include-group = "test" },
    "black",
    "nox>=2026.10.20",
]
docs = [
    "sphinx",
    "sphinx-rtd-theme",
    "myst-parser",
]

[project.urls]
Source = "https://github.com/lungoruscello/worldpoppy"
Documentation = "https://worldpoppy.readthedocs.io/en/stable/"
Examples = "https://github.com/lungoruscello/worldpoppy/tree/master/examples"

# Automatic package discovery
[tool.setuptools.packages.find]
where = ["."]
include = ["worldpoppy*"]

[tool.setuptools.package-data]
worldpoppy = [
  "assets/raw_api_manifest.feather",
  "assets/raw_api_manifest_timestamp.txt",
  "assets/product_definitions.toml",
  "assets/level0_500m_2000_2020_simplified_world.feather",
  "assets/global_nb_db.json",
  "assets/southern_kamchatka.feather"
]

[tool.setuptools.dynamic]
version = {attr = "worldpoppy.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: uses real data or bundled assets (may need internet or a filled cache)",
    "e2e: full traversal of WorldPop's API (opt-in via WPY_RUN_HEAVY_TESTS=1)",
    "performance: benchmarks (e.g., building lazy Dask graphs for many input files)",
]

[tool.black]
target-version = ['py310']
skip-string-normalization = true
exclude = '''
/(
    .git
    .tox
    .nox
    .coverage
    dist
    build
    __pycache__
)/
'''
